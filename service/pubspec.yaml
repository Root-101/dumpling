name: service
description: Service of dumpling, a lightweight tool to back up databases on a schedule
version: 0.1.8
publish_to: none

environment:
  sdk: ^3.14.0

dependencies:
  winter: 1.0.1                 #framework

  dart_jsonwebtoken: 3.4.1      #JWT

  #i18n: typed error messages generated from lib/i18n/*.i18n.yaml (`fvm dart run slang`)
  slang: 4.19.2
  #Imported by the code that slang generates
  intl: 0.20.3

  #DB
  drift: 2.35.4
  sqlite3: 3.9.2
  path: 1.9.1

  #sources
  postgres: 3.7.0               #connection checks of PostgreSQL sources

  #credentials of sources and destinations
  crypto: 3.0.8                 #sha256 of the encryption key
  pointycastle: 4.0.0           #AES-GCM

dev_dependencies:
  lints: 6.1.0
  test: 1.33.0

  #DB
  drift_dev: 2.35.3
  build_runner: 2.17.1
